bundle:
  name: semantic_layer

variables:
  warehouse_id:
    default: b3b9e852940178a2

resources:
  jobs:

    semantic_layer_job:
      name: semantic_layer_job_${bundle.target}

      tasks:
        - task_key: dbt_run

          dbt_task:
            project_directory: ./semantic_layer

            commands:
              - dbt deps
              - dbt run
              - dbt test

            warehouse_id: ${var.warehouse_id}
            catalog: sample_ci_cd
            schema: gold

          environment_key: default

      environments:
        - environment_key: default
          spec:
            client: "6"
            dependencies:
              - dbt-core
              - dbt-databricks

    final_pipeline_job:
      name: final_pipeline_job_${bundle.target}

      tasks:
        - task_key: ETL_Pipeline

          run_job_task:
            job_id: 186537758596128

        - task_key: semantic_layer

          depends_on:
            - task_key: ETL_Pipeline

          run_job_task:
            job_id: 703192002767875

targets:
  dev:
    mode: development

    variables:
      warehouse_id: b3b9e852940178a2

  prod:
    mode: production

    variables:
      warehouse_id: bb4fd8deddacb8cb

    workspace:
      host: https://dbc-fa8c4e91-54a4.cloud.databricks.com
      root_path: /Workspace/Users/hemanthreddyofficial04@gmail.com/.bundle/${bundle.name}/${bundle.target}