bundle:
  name: semantic_layer

resources:
  jobs:
    semantic_layer_job:
      name: semantic_layer_job_${bundle.target}

      tasks:
        - task_key: dbt_run

          dbt_task:
            project_directory: ./semantic_layer

            commands:
              - dbt deps
              - dbt run
              - dbt test

            warehouse_id: b3b9e852940178a2
            catalog: sample_ci_cd
            schema: gold

          environment_key: default

      environments:
        - environment_key: default
          spec:
            client: "6"
            dependencies:
              - dbt-core
              - dbt-databricks

targets:
  dev:
    mode: development

  prod:
    mode: production

    workspace:
      host: https://dbc-fa8c4e91-54a4.cloud.databricks.com
      root_path: /Workspace/Users/hemanthreddyofficial04@gmail.com/.bundle/${bundle.name}/${bundle.target}